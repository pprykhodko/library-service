[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "library-service"
version = "0.1.0"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]
include = ["books*", "borrowings*", "users*", "payments*", "notifications*", "library_service*"]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = "/migrations/"

[tool.coverage.run]
branch = true
source = ["users", "books", "borrowings", "payments", "notifications", "library_service"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "src/library_service/asgi.py",
    "src/library_service/wsgi.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
precision = 2
